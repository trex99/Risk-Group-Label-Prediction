name: Validate public release

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release-validator dependency
        run: python -m pip install pandas==2.3.1
      - name: Validate syntax, release policy, and asset checksums
        run: python verify_release.py
